name: Tennis slot watch

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch: {}
  
permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests tzdata

      - name: Check for available slots
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python check_tennis_slots.py

      - name: Commit updated state
        run: |
          git config user.name "tennis-watch-bot"
          git config user.email "actions@users.noreply.github.com"
          git add notified_slots.json
          git diff --staged --quiet || git commit -m "Update notified slots state [skip ci]"
          git push
